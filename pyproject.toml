[project]
name = "auto-rl"
version = "0.1.0"
description = "Minimal RL plus auto-research framework for game-like control tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "Codex" }
]

[project.scripts]
auto-rl = "auto_rl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auto_rl*"]
